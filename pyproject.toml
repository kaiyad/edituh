[project]
name = "edituh"
version = "2.0.0"
description = "Edituh - an elite documentation editor: rope engine + FastAPI + React web app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "streamlit>=1.59.1",
    "streamlit-hotkeys>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "pyinstaller>=6.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
